<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="title desc">
  <title id="title">How a Glossa module works</title>
  <desc id="desc">Glossa sends a module a request, the module may call back into Glossa's host API (HTTP, log, cache, images) while it works, then answers. For Python, Java and other programs the messages are JSON lines on stdin and stdout; JavaScript runs inside Glossa and native modules use a C ABI, with the same methods and host calls.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h { font-size: 17px; font-weight: 600; }
    .b { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; }
    .j { font-size: 11.5px; }
    .m { fill: #59636e; }
    .blue { fill: #ddf4ff; stroke: #54aeff; }
    .orange { fill: #fff1e5; stroke: #fb8f44; }
    .gray { fill: #f6f8fa; stroke: #afb8c1; }
    .rule { stroke: #54aeff; stroke-width: 1; }
    .rule2 { stroke: #fb8f44; stroke-width: 1; }
    .arrow { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .blue { fill: #0c2d6b; stroke: #4493f8; }
      .orange { fill: #3b2210; stroke: #f0883e; }
      .gray { fill: #1b2129; stroke: #656c76; }
      .rule { stroke: #4493f8; }
      .rule2 { stroke: #f0883e; }
      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="h" x="20" y="32">How a module works</text>

  <!-- Glossa -->
  <rect class="blue" x="20" y="52" width="250" height="310" rx="8" stroke-width="1.2"/>
  <text class="b" x="36" y="78">Glossa</text>
  <text class="s" x="36" y="102">The engine calls a method:</text>
  <text class="s mono" x="36" y="122">translate, detect,</text>
  <text class="s mono" x="36" y="140">dictionary, speak,</text>
  <text class="s mono" x="36" y="158">recognize</text>
  <line class="rule" x1="36" y1="176" x2="254" y2="176"/>
  <text class="b" x="36" y="200">Host API</text>
  <text class="s mono" x="36" y="224">http</text>
  <text class="s m" x="80" y="224">only to hosts the</text>
  <text class="s m" x="80" y="241">module declares, through</text>
  <text class="s m" x="80" y="258">the user's proxy</text>
  <text class="s mono" x="36" y="282">log</text>
  <text class="s m" x="80" y="282">to Glossa's log</text>
  <text class="s mono" x="36" y="306">cache_get, cache_set</text>
  <text class="s mono" x="36" y="330">image.*</text>
  <text class="s m" x="100" y="330">crop, resize, deskew…</text>

  <!-- Module -->
  <rect class="orange" x="690" y="52" width="250" height="310" rx="8" stroke-width="1.2"/>
  <text class="b" x="706" y="78">Your module</text>
  <text class="s m" x="706" y="100">A folder in a modules folder:</text>
  <text class="s mono" x="706" y="126">module.toml</text>
  <text class="s m" x="706" y="145">id, runtime, capabilities,</text>
  <text class="s m" x="706" y="162">allowed hosts, options</text>
  <line class="rule2" x1="706" y1="180" x2="924" y2="180"/>
  <text class="s mono" x="706" y="204">main.js, main.py, a jar,</text>
  <text class="s mono" x="706" y="222">any program, a library</text>
  <text class="s m" x="706" y="246">Answers each method it</text>
  <text class="s m" x="706" y="263">declares, and may call the</text>
  <text class="s m" x="706" y="280">host API while it works.</text>
  <text class="s m" x="706" y="304">Fails with a ModuleError:</text>
  <text class="s mono" x="706" y="322">missing_credential,</text>
  <text class="s mono" x="706" y="340">network, rate_limited…</text>

  <!-- Messages -->
  <text class="s m" x="480" y="76" text-anchor="middle">Python, Java and other programs:</text>
  <text class="s m" x="480" y="93" text-anchor="middle">one JSON object per line, on stdin and stdout</text>

  <text class="j mono" x="480" y="134" text-anchor="middle">{"id":7,"method":"translate","params":{…}}</text>
  <line class="arrow" x1="280" y1="144" x2="678" y2="144" marker-end="url(#ah)"/>
  <text class="s m" x="480" y="162" text-anchor="middle">1  the request</text>

  <text class="j mono" x="480" y="196" text-anchor="middle">{"id":"h1","method":"http","params":{…}}</text>
  <line class="arrow" x1="680" y1="206" x2="282" y2="206" marker-end="url(#ah)"/>
  <text class="s m" x="480" y="224" text-anchor="middle">2  a host call, with an id of its own (optional)</text>

  <text class="j mono" x="480" y="258" text-anchor="middle">{"id":"h1","result":{"status":200,…}}</text>
  <line class="arrow" x1="280" y1="268" x2="678" y2="268" marker-end="url(#ah)"/>
  <text class="s m" x="480" y="286" text-anchor="middle">3  Glossa answers it</text>

  <text class="j mono" x="480" y="320" text-anchor="middle">{"id":7,"result":{"text":"Hola"}}</text>
  <line class="arrow" x1="680" y1="330" x2="282" y2="330" marker-end="url(#ah)"/>
  <text class="s m" x="480" y="348" text-anchor="middle">4  the result</text>

  <!-- Runtimes -->
  <text class="h" x="20" y="400">Three ways to run, one protocol</text>

  <g stroke-width="1.2">
    <rect class="gray" x="20" y="416" width="293" height="128" rx="8"/>
    <rect class="gray" x="333" y="416" width="294" height="128" rx="8"/>
    <rect class="gray" x="647" y="416" width="293" height="128" rx="8"/>
  </g>

  <text class="b" x="36" y="442">JavaScript</text>
  <text class="s" x="36" y="464">Runs inside Glossa (QuickJS), in a</text>
  <text class="s" x="36" y="481">fresh context for each call.</text>
  <text class="s mono" x="36" y="503">translate(req, host)</text>
  <text class="s mono" x="36" y="521">host.fetch, host.cache, host.image</text>

  <text class="b" x="349" y="442">Python, Java, any program</text>
  <text class="s" x="349" y="464">A child process, started on the first</text>
  <text class="s" x="349" y="481">call and stopped after 5 idle minutes.</text>
  <text class="s" x="349" y="498">JSON lines, as above.</text>
  <text class="s" x="349" y="521">SDKs in <tspan class="mono">sdk/python</tspan> and <tspan class="mono">sdk/java</tspan>.</text>

  <text class="b" x="663" y="442">Native library</text>
  <text class="s" x="663" y="464">Loaded into Glossa, with its full</text>
  <text class="s" x="663" y="481">privileges. C ABI in</text>
  <text class="s mono" x="663" y="499">include/glossa_module.h</text>
  <text class="s" x="663" y="521"><tspan class="mono">glossa-module-sdk</tspan> for Rust.</text>

  <text class="s m" x="20" y="570">The same methods, JSON and host calls in every runtime. Details: docs/modules/protocol.md.</text>
</svg>
