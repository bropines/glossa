# Recorded answers from crates/glossa-engine/src/bundled/tests.rs.

[[case]]
name = "reads an English entry"
op = "dictionary"
text = "lamp"
from = "en"
to = "zh-Hans"
[case.expect]
headword = "lamp"
contains = ["灯", "台灯", "Turn on the lamp.", "开灯。"]
result = { pronunciations = [{ audio_url = "https://dict.youdao.com/dictvoice?audio=lamp&type=1" }, {}], explanations = [{ trait = "n.", explains = ["灯", "台灯"] }, { trait = "v." }], associations = ["lamps"] }

[[case.http]]
url = "https://dict.youdao.com/jsonapi?q=lamp"
body = '''{"ec":{"word":[{"ukphone":"læmp","ukspeech":"lamp&type=1","usphone":"læmp","usspeech":"lamp&type=2",
   "trs":[{"tr":[{"l":{"i":["n. 灯；台灯"]}}]},{"tr":[{"l":{"i":["v. 照亮"]}}]}],
   "wfs":[{"wf":{"name":"复数","value":"lamps"}}],
   "return-phrase":{"l":{"i":"lamp"}}}]},
 "blng_sents_part":{"sentence-pair":[{"sentence":"Turn on the <b>lamp</b>.","sentence-translation":"开灯。"}]}}'''

[[case]]
name = "reads a Chinese entry"
op = "dictionary"
text = "灯"
from = "zh-Hans"
to = "en"
[case.expect]
headword = "灯"
contains = ["lamp (灯，台灯)"]
result = { pronunciations = [{ symbol = "dēng" }] }

[[case.http]]
url = "https://dict.youdao.com/jsonapi?q=%E7%81%AF"
body = '''{"ce":{"word":[{"phone":"dēng","trs":[{"tr":[{"l":{"i":["",{"#text":"lamp","@action":"link"}],"#tran":"灯，台灯"}}]}]}]}}'''

[[case]]
name = "an unknown word is not found"
op = "dictionary"
text = "qwzxv"
from = "en"
to = "zh-Hans"
[case.expect]
error = "not_found"
error_contains = "qwzxv"

[[case.http]]
url = "https://dict.youdao.com/"
body = '{"input":"qwzxv","meta":{}}'

# -- errors: other statuses, and answers in a shape the module does not know --

# One side of Youdao is always Chinese. Asked for anything else, the module
# refuses before (or, for an unknown source, right after) asking the service.

[[case]]
name = "an English word into Russian is an unsupported target"
op = "dictionary"
text = "lamp"
from = "en"
to = "ru"
[case.expect]
error = "target_language"

[[case]]
name = "a Chinese word into Russian is an unsupported target"
op = "dictionary"
text = "灯"
from = "zh-Hans"
to = "ru"
[case.expect]
error = "target_language"

[[case]]
name = "an unknown source is judged by the dictionary that answered"
op = "dictionary"
text = "lamp"
from = "auto"
to = "ru"
[case.expect]
error = "target_language"

[[case.http]]
url = "https://dict.youdao.com/jsonapi"
body = '{"ec":{"word":[{"trs":[{"tr":[{"l":{"i":["n. 灯；台灯"]}}]}],"return-phrase":{"l":{"i":"lamp"}}}]}}'

[[case]]
name = "an unknown source into Chinese is answered"
op = "dictionary"
text = "lamp"
from = "auto"
to = "zh-Hant"
[case.expect]
headword = "lamp"
contains = ["台灯"]

[[case.http]]
url = "https://dict.youdao.com/jsonapi"
body = '{"ec":{"word":[{"trs":[{"tr":[{"l":{"i":["n. 灯；台灯"]}}]}],"return-phrase":{"l":{"i":"lamp"}}}]}}'

[[case]]
name = "a rate limit is typed"
op = "dictionary"
text = "lamp"
from = "en"
to = "zh-Hans"
[case.expect]
error = "rate_limited"

[[case.http]]
url = "https://dict.youdao.com/jsonapi"
status = 429
body = ''

[[case]]
name = "a server error is an http error"
op = "dictionary"
text = "lamp"
from = "en"
to = "zh-Hans"
[case.expect]
error = "module"
error_contains = "Youdao answered 502"

[[case.http]]
url = "https://dict.youdao.com/jsonapi"
status = 502
body = '<html><body>Bad gateway</body></html>'

[[case]]
name = "a page instead of JSON is a bad response"
op = "dictionary"
text = "lamp"
from = "en"
to = "zh-Hans"
[case.expect]
error = "bad_response"

[[case.http]]
url = "https://dict.youdao.com/jsonapi"
body = '<html><body>Bad gateway</body></html>'

[[case]]
name = "an entry in another shape is a bad response, not a crash"
op = "dictionary"
text = "lamp"
from = "en"
to = "zh-Hans"
[case.expect]
error = "bad_response"
error_contains = "changed its answer"

[[case.http]]
url = "https://dict.youdao.com/jsonapi"
body = '{"ec":{"word":[{"trs":"n. 灯"}]}}'
