# Lara Translate without a key, through the endpoint of its public web page.
# Bundled with Glossa; see main.js for the protocol.
capabilities = ["translate"]
languages = [
  "af", "az", "sq", "ar", "hy", "eu", "be", "bg", "ca", "zh-Hans", "zh-Hant", "hr", "cs", "da", "nl", "en",
  "et", "fi", "fil", "fr", "gl", "de", "el", "ht", "he", "hi", "hu", "is", "id", "it", "ga", "ja", "ka",
  "ko", "lv", "lt", "mk", "ms", "mt", "nb", "fa", "pl", "pt", "ro", "ru", "sr", "sk", "sl", "es", "sw",
  "sv", "th", "tr", "uk", "ur", "vi", "cy", "eo", "la", "lo", "kk", "si", "tg", "te", "km", "mn", "kn",
  "ta", "mr", "bn", "tt",
]

[module]
id = "lara"
name = "Lara"
version = "1.0.0"
runtime = "js"
entry = "main.js"
description = "Lara Translate (Translated's model) with no key or account, as on laratranslate.com."
homepage = "https://laratranslate.com"
author = "Glossa"
license = "MIT OR Apache-2.0"
max_input_chars = 5000
ready_to_use = true

[permissions]
network = ["webapi.laratranslate.com"]
