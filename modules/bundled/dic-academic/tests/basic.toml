# Recorded answers from crates/glossa-engine/src/bundled/tests.rs.

[[case]]
name = "groups results by source"
op = "dictionary"
text = "дом"
from = "ru"
to = "en"
exact = false
[case.expect]
headword = "дом"
contains = ["Толковый словарь Даля", "Толковый словарь Ушакова"]
result = { explanations = [{ trait = "Толковый словарь Даля", explains = ["ДОМ — муж. строение для житья; избa …", "Дом — семья, хозяйство …"] }] }

[[case.http]]
url = "https://dic.academic.ru/searchall.php"
body = '''<html><div id="search_results"><ul class="terms-list" id="found_articles">
<li><p><span class="item">1</span><strong><a href="//dal.academic.ru/1/ДОМ">ДОМ</a></strong> — муж. строение для житья; &amp;#160;избa …</p>
<p class="src"><a href="//dic.academic.ru/contents.nsf/enc2p/">Толковый словарь Даля</a></p></li>
<li><p><span class="item">2</span><strong><a href="//x">дом</a></strong> — жилое здание …</p>
<p class="src"><a href="//y">Толковый словарь Ушакова</a></p></li>
<li><p><span class="item">3</span><strong><a href="//z">Дом</a></strong> — семья, хозяйство …</p>
<p class="src"><a href="//dic.academic.ru/contents.nsf/enc2p/">Толковый словарь Даля</a></p></li>
</ul></div></html>'''

[[case]]
name = "nothing found is not found"
op = "dictionary"
text = "qwzxv"
from = "ru"
to = "en"
[case.expect]
error = "not_found"
error_contains = "qwzxv"

[[case.http]]
url = "https://dic.academic.ru/"
body = "<html>Ничего не найдено</html>"

# -- errors: other statuses, and answers in a shape the module does not know --

[[case]]
name = "a rate limit is typed"
op = "dictionary"
text = "дом"
from = "ru"
to = "en"
[case.expect]
error = "rate_limited"

[[case.http]]
url = "https://dic.academic.ru/searchall.php"
status = 429
body = ''

[[case]]
name = "a server error is an http error"
op = "dictionary"
text = "дом"
from = "ru"
to = "en"
[case.expect]
error = "module"
error_contains = "Academic answered 502"

[[case.http]]
url = "https://dic.academic.ru/searchall.php"
status = 502
body = '<html><body>Bad gateway</body></html>'
