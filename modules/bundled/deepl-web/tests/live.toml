# A health check against the real DeepL. The cases in basic.toml assert
# recorded answers and so cannot pass against the live service; these ask
# for something ordinary and check only the shape of what comes back (the
# harness itself refuses an empty translation or article). Marked `live`:
# an offline run skips them, and
#   glossa-cli module test --live --case "live:" modules/bundled/deepl-web
# runs them. See docs/modules/testing.md#live-health-checks.

[[case]]
name = "live: translates a sentence"
op = "translate"
live = true
text = "Good morning, how are you?"
from = "auto"
to = "de"
expect = { detected = "en" }
