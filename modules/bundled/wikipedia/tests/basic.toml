# Recorded answers from crates/glossa-engine/src/bundled/tests.rs.

[[case]]
name = "reads the summary from the source language's Wikipedia"
op = "dictionary"
text = "Lampe"
from = "de"
to = "ru"
[case.expect]
headword = "Lampe"
contains = ["Lichtquelle", "Eine Lampe ist eine Lichtquelle.", "Sie leuchtet."]
result = { link = "https://de.wikipedia.org/wiki/Lampe", explanations = [{ trait = "Lichtquelle", explains = ["Eine Lampe ist eine Lichtquelle.", "Sie leuchtet."] }] }

[[case.http]]
url = "https://de.wikipedia.org/api/rest_v1/page/summary/Lampe"
body = '''{"type":"standard","title":"Lampe","description":"Lichtquelle","extract":"Eine Lampe ist eine Lichtquelle.\nSie leuchtet.",
  "content_urls":{"desktop":{"page":"https://de.wikipedia.org/wiki/Lampe"}}}'''

[[case]]
name = "an unknown word with an unknown source asks English Wikipedia"
op = "dictionary"
text = "qwzxv"
from = "auto"
to = "ru"
[case.expect]
error = "not_found"
error_contains = "qwzxv"

[[case.http]]
url = "https://en.wikipedia.org/"
status = 404
body = '{"status":404}'

# -- errors: other statuses, and answers in a shape the module does not know --

[[case]]
name = "a rate limit is typed"
op = "dictionary"
text = "lamp"
from = "en"
to = "ru"
[case.expect]
error = "rate_limited"

[[case.http]]
url = "https://en.wikipedia.org/api/rest_v1/page/summary/"
status = 429
body = '{}'

[[case]]
name = "a server error is an http error"
op = "dictionary"
text = "lamp"
from = "en"
to = "ru"
[case.expect]
error = "module"
error_contains = "Wikipedia answered 503"

[[case.http]]
url = "https://en.wikipedia.org/api/rest_v1/page/summary/"
status = 503
body = '<html><body>Bad gateway</body></html>'

[[case]]
name = "a page instead of JSON is a bad response"
op = "dictionary"
text = "lamp"
from = "en"
to = "ru"
[case.expect]
error = "bad_response"

[[case.http]]
url = "https://en.wikipedia.org/api/rest_v1/page/summary/"
body = '<html><body>Bad gateway</body></html>'

[[case]]
name = "a summary in another shape is a bad response"
op = "dictionary"
text = "lamp"
from = "en"
to = "ru"
[case.expect]
error = "bad_response"
error_contains = "changed its answer"

[[case.http]]
url = "https://en.wikipedia.org/api/rest_v1/page/summary/"
body = '"moved"'
