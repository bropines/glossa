# Recorded answers from crates/glossa-engine/src/bundled/tests.rs.

[[case]]
name = "reads parts of speech and subjects"
op = "dictionary"
text = "lamp"
from = "en"
to = "ru"
[case.expect]
headword = "lamp"
contains = ["General: лампа (a device for giving light); светильник", "Mining: шахтёрская лампа", "Slang: отдыхать"]
result = { pronunciations = [{ symbol = "læmp" }], explanations = [{ trait = "lamp n" }, { trait = "lamp v" }], associations = ["table lamp", "lava lamp"] }

[[case.http]]
url = "https://www.multitran.com/m.exe"
body_file = "responses/lamp.html"

[[case]]
name = "an unknown word is not found"
op = "dictionary"
text = "дом"
from = "auto"
to = "ru"
options = { labels = "ru" }
[case.expect]
error = "not_found"
error_contains = "дом"

[[case.http]]
url = "https://www.multitran.com/m.exe"
body = "<html>nothing here</html>"

# -- errors: other statuses, and answers in a shape the module does not know --

[[case]]
name = "a rate limit is typed"
op = "dictionary"
text = "lamp"
from = "en"
to = "ru"
[case.expect]
error = "rate_limited"

[[case.http]]
url = "https://www.multitran.com/m.exe"
status = 429
body = ''

[[case]]
name = "a server error is an http error"
op = "dictionary"
text = "lamp"
from = "en"
to = "ru"
[case.expect]
error = "module"
error_contains = "Multitran answered 503"

[[case.http]]
url = "https://www.multitran.com/m.exe"
status = 503
body = '<html><body>Bad gateway</body></html>'
