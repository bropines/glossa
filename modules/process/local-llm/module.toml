# Offline translation with a small language model on llama.cpp. A process
# module: `local-llm` is a small Rust program (src/), downloaded as an
# asset, that Glossa starts on the first translation. It starts llama-server
# from the official llama.cpp release (another asset) with the chosen model
# and stops it when Glossa closes the module, so an idle Glossa holds no
# model in memory. README.md has the details, the licences and how the
# program is released.
# Only `translate`: the program also answers `detect` for Qwen3 and custom
# models, but Hy-MT2 misnames languages (it called Russian "English" in
# tests), so detection is not offered.
capabilities = ["translate"]

[module]
id = "local-llm"
name = "Local LLM (offline)"
version = "0.1.0"
api = 1
runtime = "process"
command.windows = ["${ASSETS_DIR}/bin/local-llm.exe"]
command.unix = ["${ASSETS_DIR}/bin/local-llm"]
# A loaded model takes about 1.5 GB; give it back three minutes after the
# last translation. The next one loads it again in a second or two.
idle_timeout_secs = 180
# Keeps one answer well inside Glossa's call timeout on a laptop CPU.
max_input_chars = 2000
description = "Offline translation with a small language model (Hy-MT2 or Qwen3) on llama.cpp. No account, nothing leaves the computer."
homepage = "https://github.com/bropines/glossa/tree/main/modules/process/local-llm"
author = "Glossa contributors"
license = "MIT OR Apache-2.0 (llama.cpp MIT, models Apache-2.0)"
# [[assets]] came after 0.1.0-beta.2. Set `min_glossa` to the next version in
# the commit that bumps the workspace version: a value above the build's own
# makes that build, the tests included, refuse the module.
# The settings page uses `file` and [ui.settings].
min_glossa = "0.1.0-beta.2"

[permissions]
# Only where the files come from; the program itself talks to llama-server
# on 127.0.0.1 and nothing else.
network = ["github.com", "huggingface.co"]

# -- options --------------------------------------------------------------------

[[options]]
key = "model"
type = "select"
label = "Model"
default = "hy-mt2"
choices = [
    { value = "hy-mt2", label = "Hy-MT2 1.8B, a translation model: 33 languages (1.13 GB, Apache-2.0)" },
    { value = "qwen3", label = "Qwen3 1.7B, a general model: more languages, looser (1.28 GB, Apache-2.0)" },
    { value = "custom", label = "My own GGUF file" },
]
help = "Download the model under Files first. Hy-MT2 was made for translation and keeps closer to the text; Qwen3 knows more languages."

[[options]]
key = "custom_model"
type = "file"
label = "GGUF file"
filters = ["gguf"]
visible_if = "options.model == 'custom'"
help = "An instruction-tuned chat model in GGUF form that llama.cpp runs. Check its licence yourself: some (Gemma, Llama) come with terms of their own."

[[options]]
key = "gpu"
type = "bool"
label = "Use the GPU"
default = true
help = "Metal on a Mac with Apple silicon. The Windows and Linux builds here run on the processor, so this changes nothing there."

[[options]]
key = "threads"
type = "number"
label = "Threads"
default = 0
min = 0
max = 256
help = "Processor threads for the model. 0 lets llama.cpp choose."

[[options]]
key = "context"
type = "number"
label = "Context length (tokens)"
default = 4096
min = 512
max = 32768
step = 512
help = "The prompt and the answer together. More holds longer texts and takes more memory."

[ui]
format = 1

[ui.settings]
layout = ["ollama", "model_box", "speed"]

[[ui.settings.items]]
id = "ollama"
type = "label"
style = "weak"
label = "Already running Ollama or LM Studio? You do not need this module: add an AI endpoint with the Ollama preset instead (Options → Services → AI endpoints)."

[[ui.settings.items]]
id = "model_box"
type = "group"
label = "Model"
children = ["model", "custom_model"]

[[ui.settings.items]]
id = "speed"
type = "group"
label = "Speed and memory"
collapsed = true
children = ["gpu", "threads", "context"]

# -- files ----------------------------------------------------------------------
