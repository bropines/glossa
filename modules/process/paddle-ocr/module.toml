# The models: PP-OCRv5 mobile as RapidOCR 3.10 publishes them in ONNX form,
# pinned to the v3.10.0 tag. The hashes are RapidOCR's own
# (default_models.yaml) and were checked against the downloads.

[[assets]]   # finds the lines; every script uses it
name = "det.onnx"
url = "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.10.0/onnx/PP-OCRv5/det/ch_PP-OCRv5_det_mobile.onnx"
sha256 = "4d97c44a20d30a81aad087d6a396b08f786c4635742afc391f6621f5c6ae78ae"
size = 4819576

[[assets]]   # turns upside-down lines round
name = "cls.onnx"
