[module]
description = "Бесплатный OCR API сервиса OCR.space: строки и слова с рамками, более 25 языков."

[options.api_key]
label = "Ключ API"
help = "Бесплатный ключ выдают на https://ocr.space/ocrapi"

[options.engine]
label = "Движок"

[options.engine.choices]
1 = "Движок 1 (больше языков)"
2 = "Движок 2 (язык определяется сам, лучше для латиницы)"
