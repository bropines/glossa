# Cases for `glossa-cli module test`. The answers are recorded, so no key
# and no network are needed; the key below is an obvious fake. Run against
# the real service with
#   glossa-cli module test --live --set-from-env api_key=MY_KEY modules/python/ocr-space
# See docs/modules/testing.md.

options = { api_key = "test-key" }

[[case]]
name = "reads a line with word boxes"
op = "ocr"
image = { width = 200, height = 60 }
lang = "en"
[case.expect]
text = "Hello world"
result = { blocks = [{ level = "line", text = "Hello world", children = [{ text = "Hello", bounds = { x = 20, y = 15, width = 75, height = 30 } }, { text = "world" }] }] }
[[case.http]]
method = "POST"
url = "https://api.ocr.space/parse/image"
body = '''
{"ParsedResults": [{"ParsedText": "Hello world\r\n", "TextOverlay": {"Lines": [{"LineText": "Hello world",
  "Words": [{"WordText": "Hello", "Left": 20, "Top": 15, "Width": 75, "Height": 30},
            {"WordText": "world", "Left": 105, "Top": 15, "Width": 75, "Height": 30}]}]}}],
 "IsErroredOnProcessing": false}
'''

[[case]]
name = "no key, no call"
op = "ocr"
image = { width = 200, height = 60 }
options = { api_key = "" }
expect = { error = "missing_credential" }

[[case]]
name = "a rejected key asks for a new one"
op = "ocr"
image = { width = 200, height = 60 }
expect = { error = "missing_credential" }
[[case.http]]
method = "POST"
url = "https://api.ocr.space/parse/image"
status = 403
body = "The API key is invalid"

[[case]]
name = "the daily limit is a rate limit"
op = "ocr"
image = { width = 200, height = 60 }
expect = { error = "rate_limited" }
[[case.http]]
method = "POST"
url = "https://api.ocr.space/parse/image"
status = 200
body = "You may only perform this action upto maximum number of 500 times within 86400 seconds"

[[case]]
name = "an outage is an http error"
op = "ocr"
image = { width = 200, height = 60 }
expect = { error = "module", error_contains = "HTTP 502" }
[[case.http]]
method = "POST"
url = "https://api.ocr.space/parse/image"
status = 502
body = "Bad Gateway"

[[case]]
name = "a page instead of JSON is a bad response"
op = "ocr"
image = { width = 200, height = 60 }
expect = { error = "bad_response" }
[[case.http]]
method = "POST"
url = "https://api.ocr.space/parse/image"
body = "<html>Maintenance</html>"

[[case]]
name = "a picture the service cannot process is a bad response"
op = "ocr"
image = { width = 200, height = 60 }
expect = { error = "bad_response", error_contains = "Unable to recognize the file type" }
[[case.http]]
method = "POST"
url = "https://api.ocr.space/parse/image"
body = '{"OCRExitCode": 3, "IsErroredOnProcessing": true, "ErrorMessage": ["Unable to recognize the file type"]}'

[[case]]
name = "results in another shape are a bad response"
op = "ocr"
image = { width = 200, height = 60 }
expect = { error = "bad_response", error_contains = "changed its answer" }
[[case.http]]
method = "POST"
url = "https://api.ocr.space/parse/image"
body = '{"ParsedResults": ["text"], "IsErroredOnProcessing": false}'
