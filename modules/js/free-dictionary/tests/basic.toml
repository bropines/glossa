# Cases for `glossa-cli module test`. The module calls dictionaryapi.dev;
# the [[case.http]] entries are what the service answered, so the cases run
# offline. Refresh them with `glossa-cli module test --record` (it writes
# tests/recorded/) and compare. See docs/modules/testing.md.

# One definition per part of speech, to check the option is honoured.
options = { max_definitions = 1 }

[[case]]
name = "looks up a word"
op = "dictionary"
text = "Hello"
from = "en"
to = "ru"
[case.expect]
headword = "hello"
contains = ["greeting (salutation)", "/həˈləʊ/", "She gave me a cheery hello."]
result = { pronunciations = [{ region = "UK" }, { region = "US" }], link = "https://en.wiktionary.org/wiki/hello" }
[[case.http]]
url = "https://api.dictionaryapi.dev/api/v2/entries/en/hello"
body_file = "responses/hello.json"

[[case]]
name = "an unknown word is not found"
op = "dictionary"
text = "qwzxv"
from = "en"
expect = { error = "not_found", error_contains = "qwzxv" }
[[case.http]]
url = "https://api.dictionaryapi.dev/api/v2/entries/en/qwzxv"
status = 404
body = '{"title": "No Definitions Found"}'

[[case]]
name = "only English is offered"
op = "dictionary"
text = "Haus"
from = "de"
expect = { error = "source_language" }

[[case]]
name = "a rate limit is typed"
op = "dictionary"
text = "slow"
from = "en"
expect = { error = "rate_limited" }
[[case.http]]
url = "https://api.dictionaryapi.dev/api/v2/entries/en/slow"
status = 429
body = "Too Many Requests"

[[case]]
name = "an outage is an http error"
op = "dictionary"
text = "down"
from = "en"
expect = { error = "module", error_contains = "dictionaryapi.dev answered 503" }
[[case.http]]
url = "https://api.dictionaryapi.dev/api/v2/entries/en/down"
status = 503
body = "Service Unavailable"

[[case]]
name = "an answer that is not a list of entries is a bad response"
op = "dictionary"
text = "shape"
from = "en"
expect = { error = "bad_response", error_contains = "changed its answer" }
[[case.http]]
url = "https://api.dictionaryapi.dev/api/v2/entries/en/shape"
body = '{"word": "shape", "meanings": []}'

# A health check against the real service: only the shape of the answer is
# checked. Skipped offline; `--live --case "live:"` runs it.
[[case]]
name = "live: looks up a word"
op = "dictionary"
live = true
text = "house"
from = "en"
expect = { headword = "house" }
