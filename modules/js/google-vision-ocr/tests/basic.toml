# Cases for `glossa-cli module test`. The answers are recorded, so no key
# and no network are needed; the key below is an obvious fake. Run against
# the real service with
#   glossa-cli module test --live --set-from-env api_key=MY_KEY modules/js/google-vision-ocr
# See docs/modules/testing.md.

options = { api_key = "test-key" }

[[case]]
name = "reads two words with their boxes"
op = "ocr"
image = { width = 200, height = 60 }
[case.expect]
text = "Hello world"
detected = "en"
# The layout survives the trip: block > paragraph > line > word.
result = { blocks = [{ level = "block", children = [{ level = "paragraph", children = [{ level = "line", text = "Hello world", children = [{ text = "Hello" }, { text = "world" }] }] }] }] }
[[case.http]]
method = "POST"
url = "https://vision.googleapis.com/v1/images:annotate"
body_file = "responses/hello-world.json"

[[case]]
name = "no key, no call"
op = "ocr"
image = { width = 200, height = 60 }
options = { api_key = "" }
expect = { error = "missing_credential" }

[[case]]
name = "a rejected key asks for a new one"
op = "ocr"
image = { width = 200, height = 60 }
expect = { error = "missing_credential" }
[[case.http]]
method = "POST"
url = "https://vision.googleapis.com/v1/images:annotate"
status = 400
body = '{"error": {"code": 400, "message": "API key not valid. Please pass a valid API key.", "status": "INVALID_ARGUMENT"}}'

[[case]]
name = "a picture without text is not found"
op = "ocr"
image = { width = 200, height = 60 }
expect = { error = "not_found" }
[[case.http]]
method = "POST"
url = "https://vision.googleapis.com/v1/images:annotate"
body = '{"responses": [{}]}'

[[case]]
name = "custom language hints, scene detection, no enlarging"
op = "ocr"
image = { width = 200, height = 60 }
options = { api_key = "test-key", hints = "custom", custom_hints = ["ru", "de"], feature = "TEXT_DETECTION", enlarge = false, max_side = 2000 }
[case.expect]
text = "Hello world"
[[case.http]]
method = "POST"
url = "https://vision.googleapis.com/v1/images:annotate"
body_file = "responses/hello-world.json"

# ---- Actions (the settings page's buttons) ---------------------------------

[[case]]
name = "test: an accepted key"
op = "action"
action = "test"
[case.expect]
text = "Vision accepts the key."
result = { notice_level = "success" }
[[case.http]]
method = "POST"
url = "https://vision.googleapis.com/v1/images:annotate"
body = "{}"

[[case]]
name = "test: a refused key is marked on its field, in Russian"
op = "action"
action = "test"
ui_lang = "ru"
[case.expect]
result = { errors = { api_key = "Ключ не подошёл: API key not valid. Please pass a valid API key." } }
[[case.http]]
method = "POST"
url = "https://vision.googleapis.com/v1/images:annotate"
status = 400
body = '{"error": {"code": 400, "message": "API key not valid. Please pass a valid API key.", "status": "INVALID_ARGUMENT"}}'

[[case]]
name = "test: an outage is an error, not a bad key"
op = "action"
action = "test"
expect = { error = "module", error_contains = "HTTP 503" }
[[case.http]]
method = "POST"
url = "https://vision.googleapis.com/v1/images:annotate"
status = 503
body = '{"error": {"code": 503, "message": "Service unavailable"}}'

[[case]]
name = "all languages fill the language list"
op = "action"
action = "all_languages"
[case.expect]
text = "58 languages."
result = { choices = { custom_hints = [{ value = "af", label = "Afrikaans" }, { value = "sq" }] } }

[[case]]
name = "the quota is a rate limit"
op = "ocr"
image = { width = 200, height = 60 }
expect = { error = "rate_limited" }
[[case.http]]
method = "POST"
url = "https://vision.googleapis.com/v1/images:annotate"
status = 429
body = '{"error": {"code": 429, "message": "Quota exceeded for quota metric.", "status": "RESOURCE_EXHAUSTED"}}'

[[case]]
name = "an outage is an http error"
op = "ocr"
image = { width = 200, height = 60 }
expect = { error = "module", error_contains = "HTTP 503" }
[[case.http]]
method = "POST"
url = "https://vision.googleapis.com/v1/images:annotate"
status = 503
body = "Service Unavailable"

[[case]]
name = "an answer without responses is a bad response"
op = "ocr"
image = { width = 200, height = 60 }
expect = { error = "bad_response", error_contains = "changed its answer" }
[[case.http]]
method = "POST"
url = "https://vision.googleapis.com/v1/images:annotate"
body = '{"results": []}'

[[case]]
name = "a page instead of JSON is a bad response"
op = "ocr"
image = { width = 200, height = 60 }
expect = { error = "bad_response" }
[[case.http]]
method = "POST"
url = "https://vision.googleapis.com/v1/images:annotate"
body = "<html>Sign in</html>"
