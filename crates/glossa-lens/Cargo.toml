[package]
name = "glossa-lens"
description = "Google Lens for Glossa: chrome-lens-rs's protos, picture encoding and request, sent by Glossa's own HTTP client, and the reply as text with its layout and line-by-line translation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Bropines' Rust Lens client, by git and pinned: the protos (generated from
# Chromium's own, pinned there), the picture as Chromium encodes it, the
# request Chromium sends, the reply. Without its `client` feature it brings no
# HTTP stack of its own (Glossa sends through ureq), and without
# `extra-formats` no image decoders beyond Glossa's.
chrome_lens_ocr = { git = "https://github.com/bropines/chrome-lens-rs", rev = "2d96e6a2058c16b909552b322930df53ee9a5aeb", default-features = false }
image = { workspace = true }

[dev-dependencies]
# Building requests and replies to check against.
prost = "0.14"
