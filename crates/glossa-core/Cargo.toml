[package]
name = "glossa-core"
description = "Domain model of Glossa: languages, capabilities, requests, config, themes, history."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-segmentation = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
# Reading the settings file value by value (`Config::from_toml_lenient`):
# which key a value that does not fit is under, and which keys nothing read.
# Both are a few hundred lines on serde alone.
serde_ignored = "0.1"
serde_path_to_error = "0.1"
