[package]
name = "glossa-modules"
description = "The provider API and the module runtimes: JavaScript (Glossa, classic QTranslate, pot-app), Python, Java and any program over stdio, native."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["js", "python", "process", "native", "image"]
js = ["dep:rquickjs", "dep:stacker"]
python = []
# Any program over stdio (`runtime = "process"`) and Java modules (`runtime = "java"`).
process = []
native = ["dep:libloading"]
# The image API offered to modules as `image.*` host calls.
image = ["dep:image"]

[dependencies]
glossa-core = { workspace = true }
glossa-net = { workspace = true }
glossa-module-sdk = { path = "../glossa-module-sdk" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
# arc_lock: a guard that outlives the borrow of the per-folder lock map (assets).
parking_lot = { workspace = true, features = ["arc_lock"] }
base64 = { workspace = true }
thiserror = { workspace = true }
rquickjs = { workspace = true, optional = true }
stacker = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
image = { workspace = true, optional = true }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Unpacking `unpack = "tar.gz"` module assets; already in the tree through glossa-dict and png.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# `pattern` checks on settings fields. Already linked, with exactly these
# features, through tracing-subscriber's env-filter, so it adds no code; the
# `regex` crate (and regex-syntax's Unicode tables) would.
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "dfa-build", "dfa-search"] }

# Ending a module's process together with the processes it started
# (`proc_tree`): a process group on Unix, a job object on Windows. Both
# crates are in the tree already (std and ureq's stack; glossa-services).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
glossa-net = { workspace = true }

# machete reads `use md5::…` as a different crate from `md-5`.
[package.metadata.cargo-machete]
ignored = ["md-5"]
