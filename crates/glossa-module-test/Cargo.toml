[package]
name = "glossa-module-test"
description = "The module test harness behind `glossa-cli module test`: manifest checks, fixtures, recorded HTTP and result-shape checks for Glossa modules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
glossa-core = { workspace = true }
glossa-net = { workspace = true }
# Every runtime, so a module is tested the way the desktop program loads it.
glossa-modules = { workspace = true, features = ["js", "python", "process", "native", "image"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
# Names the manifest keys serde skipped, so a misspelt key is reported
# instead of silently ignored. Depends on serde alone.
serde_ignored = "0.1"
