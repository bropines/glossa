[package]
name = "glossa-module-sdk"
description = "Write Glossa modules in Rust (or anything with a C ABI): wire types, the native ABI, and an export macro."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Deliberately tiny: a module author depends on this crate and nothing else
# from Glossa, so a module keeps building across Glossa releases as long as
# the protocol version matches.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
