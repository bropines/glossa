[package]
name = "glossa-ocr"
description = "Text recognition providers: chrome-lens (daemon, CLI), Windows OCR, OneOCR, external commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
glossa-core = { workspace = true }
glossa-net = { workspace = true }
glossa-modules = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
dirs = "7"

# Windows OCR (WinRT) and OneOCR (the Snipping Tool's DLL, loaded at run time).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }
