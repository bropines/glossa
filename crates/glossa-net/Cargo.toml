[package]
name = "glossa-net"
description = "HTTP for Glossa: proxy, timeouts, retries, legacy code pages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
glossa-core = { workspace = true }
ureq = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
percent-encoding = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Certificates are checked by the operating system on Windows and macOS (see
# `tls_config`); Linux keeps the bundled Mozilla roots.
ureq = { workspace = true, features = ["platform-verifier"] }

[target.'cfg(target_os = "macos")'.dependencies]
ureq = { workspace = true, features = ["platform-verifier"] }
