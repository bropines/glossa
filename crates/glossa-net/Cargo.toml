[package]
name = "glossa-net"
description = "HTTP for Glossa: proxy, timeouts, retries, legacy code pages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
glossa-core = { workspace = true }
ureq = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
percent-encoding = { workspace = true }
tracing = { workspace = true }

# Certificates are checked against the system's store everywhere (see
# `tls_config`): by the OS on Windows and macOS, against the CA files on
# Linux and the BSDs, with the bundled Mozilla roots (ureq's default) as the
# fallback where the system has none.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
ureq = { workspace = true, features = ["platform-verifier"] }

[target.'cfg(target_os = "macos")'.dependencies]
ureq = { workspace = true, features = ["platform-verifier"] }

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
ureq = { workspace = true, features = ["platform-verifier"] }
# Already in the tree through the platform verifier; used directly to see
# whether the system store is empty before relying on it.
rustls-native-certs = "0.8"
