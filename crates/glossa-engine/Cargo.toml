[package]
name = "glossa-engine"
description = "The UI-independent core of Glossa: jobs, the translation pipeline, history, catalogues, the control API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["js", "python", "process", "native", "image"]
js = ["glossa-modules/js"]
python = ["glossa-modules/python"]
process = ["glossa-modules/process"]
native = ["glossa-modules/native"]
image = ["glossa-modules/image"]

[dependencies]
glossa-core = { workspace = true }
glossa-net = { workspace = true }
glossa-modules = { workspace = true }
glossa-services = { workspace = true }
glossa-ocr = { workspace = true }
glossa-dict = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# The D-Bus service (`dbus`). `blocking` runs a translation off zbus's
# executor thread; zbus already depends on it.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { workspace = true }
blocking = "1.7"
