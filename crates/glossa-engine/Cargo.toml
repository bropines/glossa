[package]
name = "glossa-engine"
description = "The UI-independent core of Glossa: jobs, the translation pipeline, history, catalogues, the control API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["js", "python", "process", "native", "image"]
js = ["glossa-modules/js"]
python = ["glossa-modules/python"]
process = ["glossa-modules/process"]
native = ["glossa-modules/native"]
image = ["glossa-modules/image"]

[dependencies]
glossa-core = { workspace = true }
glossa-net = { workspace = true }
glossa-modules = { workspace = true }
# The module test harness, for the module editor's Check and Test.
glossa-module-test = { workspace = true }
glossa-services = { workspace = true }
glossa-ocr = { workspace = true }
glossa-dict = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
# For the proof `/health` gives `glossa-cli` (`server::runtime`); already in
# the tree through glossa-modules.
sha2 = "0.10"
# The built-in language detector (`langdetect`): trigram tables for seventy
# languages, about 0.6 MB in the binary, one dependency Glossa already has
# (hashbrown). MIT.
whatlang = "0.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# The D-Bus service (`dbus`). `blocking` runs a translation off zbus's
# executor thread; zbus already depends on it.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { workspace = true }
blocking = "1.7"
