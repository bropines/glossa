name: advisories

# Known vulnerabilities in the dependencies (the RustSec advisory database),
# checked on a schedule: an advisory appears when someone publishes it, not
# when this repository changes, so ci.yml would not notice. A failed run is
# the notice; the fix is `cargo update -p <crate>` (Dependabot usually has a
# pull request open already), or an entry under `ignore` in deny.toml with
# the reason it does not apply.

on:
  schedule:
    # Mondays, 05:17 UTC.
    - cron: '17 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/Cargo.lock'
      - deny.toml
      - .github/workflows/advisories.yml
  pull_request:
    paths:
      - '**/Cargo.lock'
      - deny.toml
      - .github/workflows/advisories.yml

permissions:
  contents: read

jobs:
  advisories:
    name: advisories (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The workspace, and the two module programs with lock files of
          # their own.
          - name: glossa
            manifest: Cargo.toml
          - name: paddle-ocr
            manifest: modules/process/paddle-ocr/Cargo.toml
          - name: local-llm
            manifest: modules/process/local-llm/Cargo.toml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # cargo-deny, prebuilt in the action's image; nothing is compiled.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          manifest-path: ${{ matrix.manifest }}
          # `--config` belongs to cargo-deny itself, not to `check`. No
          # `--all-features` (the action's default here): with it cargo
          # metadata refuses glossa-platform, whose optional Linux xcap is
          # the crate its Windows and macOS builds use under another name.
          # Every other optional dependency is on by default.
          arguments: --config deny.toml
