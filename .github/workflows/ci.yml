name: ci

on:
  # Prose, legal texts, templates and the release workflow change nothing CI
  # checks.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE-*
      - NOTICE
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/release.yml
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE-*
      - NOTICE
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The compiler the releases are built with (RUST_TOOLCHAIN in release.yml;
  # change both together), so what is tested is what ships and a new stable
  # release cannot turn a pull request red by itself. The msrv job below
  # checks the oldest one supported.
  RUST_TOOLCHAIN: '1.99.1'
  # Incremental artifacts are useless on a fresh runner and bloat the cache.
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  doc:
    # Broken intra-doc links and malformed doc comments. Only the
    # workspace's own crates; the dependencies' docs are not built.
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --document-private-items --locked

  machete:
    # Dependencies a crate declares but no longer uses: they cost build time
    # and, in the binaries, size. A false positive goes into the crate's
    # `[package.metadata.cargo-machete] ignored`.
    name: unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete
      - run: cargo machete

  licences:
    # Everything that ships in the two programs, for every release target,
    # must be under a licence on the allow-list in
    # scripts/third-party-notices.py and have a licence text to put into
    # THIRD-PARTY-NOTICES. Reads `cargo metadata` and the crates' sources;
    # nothing is compiled.
    name: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo fetch --locked
      - run: python3 scripts/third-party-notices.py --check
      # The generator itself, for one target: the notices and the SBOM.
      - run: |
          python3 scripts/third-party-notices.py --target x86_64-unknown-linux-gnu -o "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt" --sbom "$RUNNER_TEMP/glossa.cdx.json"
          python3 scripts/third-party-notices.py --target x86_64-unknown-linux-gnu --summary
          python3 -m json.tool "$RUNNER_TEMP/glossa.cdx.json" > /dev/null

  clippy:
    name: clippy (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Build-time system libraries: GTK 3 for the tray icon and its menu
      # (tray-icon, muda) and ALSA for audio (rodio -> cpal). X11, Wayland,
      # libxkbcommon, libxcb and appindicator are opened at run time with
      # dlopen and need nothing here.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked
      # Every module in modules/ against its fixtures, with nothing skipped:
      # the native and Java examples are built first, and the runner has
      # Python, Node and a JDK. Copies go into the checkout only, never into
      # a commit (.gitignore covers them).
      # The managed Python and uv the Python example with dependencies needs
      # (about 40 MB), kept between runs. The key names the pinned versions
      # (PYTHON_VERSION, PBS_RELEASE, UV_VERSION in python_env.rs).
      - name: Cache the managed Python and uv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/glossa-home/runtimes
            ${{ runner.temp }}/glossa-home/cache/uv
          key: glossa-python-${{ runner.os }}-3.13.18-20261026-uv0.13.7
      - name: Module fixtures (glossa-cli module test)
        env:
          GLOSSA_HOME: ${{ runner.temp }}/glossa-home
        run: |
          cargo build --locked -p glossa-cli -p glossa-example-rot13 -p glossa-example-lines
          cp target/debug/libglossa_example_rot13.so modules/native/example-rot13/
          cp target/debug/libglossa_example_lines.so modules/native/example-lines/
          (cd modules/native/example-c && cc -shared -fPIC -std=c99 -I ../../../include -o libshout.so shout.c)
          (cd modules/java/example-upper && ./build.sh)
          # --download: the Python example with dependencies gets the
          # managed Python, uv and its package (about 45 MB) first.
          # paddle-ocr's fixtures read a picture with three recognisers,
          # which are optional assets: fetch them first (about 30 MB).
          # local-llm is left out until its program is released: the `bin`
          # asset's sha256 in its module.toml is still a placeholder (its
          # README.md, "Releasing the binary"); its protocol tests run in
          # .github/workflows/local-llm.yml.
          # `assets download` looks the module up among the installed ones,
          # so link it into a data folder both commands share.
          export GLOSSA_HOME="$RUNNER_TEMP/glossa-home"
          mkdir -p "$GLOSSA_HOME/modules"
          ln -s "$PWD/modules/process/paddle-ocr" "$GLOSSA_HOME/modules/paddle-ocr"
          target/debug/glossa-cli assets download paddle-ocr rec-latin.onnx rec-eslav.onnx rec-ch.onnx
          mapfile -t dirs < <(find modules -name module.toml -not -path 'modules/process/local-llm/*' -exec dirname {} \; | sort)
          target/debug/glossa-cli module test --strict --require-runtimes --download "${dirs[@]}"
      # Every window drawn to a PNG under Xvfb, with Mesa's llvmpipe as the
      # OpenGL driver: no GPU on the runner, and none needed.
      - name: Screenshot smoke test
        timeout-minutes: 15
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libglx-mesa0 libegl1 libgl1-mesa-dri libxkbcommon-x11-0
          cargo build -p glossa-ui-egui --locked
          xvfb-run -a -s "-screen 0 1600x1000x24" scripts/screenshot-smoke.sh target/debug/glossa target/screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-linux
          path: target/screenshots
          if-no-files-found: ignore
          retention-days: 7
      # The Tesseract provider against the real program, on a picture the
      # test draws itself.
      - name: Tesseract live test
        run: |
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus
          cargo test -p glossa-ocr --locked tesseract:: -- --ignored --nocapture

  macos:
    # The code behind cfg(target_os = "macos") (Apple Vision OCR, AppKit,
    # Accessibility) is only compiled, linted and tested here. macos-latest
    # runs on Apple silicon.
    name: clippy + test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Every window drawn to a PNG (the runner has a window server). A
      # debug build: its dependencies are already built for the tests.
      - name: Screenshot smoke test
        timeout-minutes: 15
        run: |
          cargo build -p glossa-ui-egui --locked
          scripts/screenshot-smoke.sh target/debug/glossa target/screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-macos
          path: target/screenshots
          if-no-files-found: ignore
          retention-days: 7
      # Vision ships with macOS, so the live test can run on the runner; it is
      # informative rather than gating while the runners' Vision behaviour is
      # unproven.
      - name: Apple Vision live test
        continue-on-error: true
        run: cargo test -p glossa-ocr --locked vision::tests::recognises -- --ignored --nocapture

  windows:
    # The platform code behind cfg(windows) (UI Automation, the clipboard,
    # synthetic input, the registry) is only compiled, linted and tested here.
    # Native MSVC on the runner; the author's own builds cross-compile with
    # x86_64-pc-windows-gnu from WSL instead (see AGENTS.md).
    name: clippy + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Every window drawn to a PNG. The runner has no GPU and no OpenGL
      # beyond 1.1, so the software renderer (WARP) draws. A debug build
      # has a console, so the script sees the program's messages.
      - name: Screenshot smoke test
        timeout-minutes: 15
        shell: bash
        env:
          GLOSSA_RENDERER: software
        run: |
          cargo build -p glossa-ui-egui --locked
          scripts/screenshot-smoke.sh target/debug/glossa.exe target/screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-windows
          path: target/screenshots
          if-no-files-found: ignore
          retention-days: 7

  msrv:
    # The oldest compiler the workspace claims to support: rust-version in
    # Cargo.toml, which has to follow the newest MSRV among the dependencies
    # (egui and eframe set it). A check is enough: lints differ between
    # releases, and the stable jobs above run the tests.
    name: check (msrv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked
