name: release

# Tag v1.2.3 (matching the workspace version in Cargo.toml) -> a draft GitHub
# release with installers, portable archives and packages for every platform
# and processor, and SHA256SUMS. Review the draft and publish it by hand. To
# redo a failed run, delete the draft first. Run it by hand (Actions → release
# → Run workflow) to build everything without a release: the files are then
# the run's artifacts. The packaging scripts live in packaging/ (see
# docs/install.md).
#
# <arch> is x86_64 or arm64 (AppImage: aarch64; Debian: amd64 or arm64).
#
# Windows (x86_64, arm64):
#   glossa-1.2.3-<arch>-windows-setup.exe     installer (Inno Setup,
#                                              packaging/windows/glossa.iss)
#   glossa-1.2.3-<arch>-windows-portable.zip  the same files and a
#                                              portable.txt marker: the data
#                                              stays in data/ beside it
# macOS (arm64 = Apple silicon, x86_64 = Intel):
#   glossa-1.2.3-<arch>-macos.dmg             Glossa.app and an Applications
#                                              link to drag it to
#   glossa-1.2.3-<arch>-macos.zip             Glossa.app, glossa-cli, docs
# Linux (x86_64, arm64), not tested on real hardware yet:
#   glossa_1.2.3_<amd64|arm64>.deb            Debian 12, Ubuntu 22.04+
#   glossa-1.2.3-<x86_64|aarch64>.AppImage    any distribution with GTK 3
#   glossa-1.2.3-<arch>-linux-portable.tar.gz with portable.txt, as on Windows
# Bropines.Glossa*.yaml, glossa.json          winget and Scoop manifests
#                                              (packaging/fill-manifests.sh)
#
# Every archive also holds README.md, CHANGELOG.md, the licences, NOTICE,
# examples/modules/ (example modules, as source; they load once copied into
# a module folder) and sdk/python/ (glossa_module.py, which Python modules
# import; Glossa looks for it beside the executable or in the app bundle).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      numeric: ${{ steps.v.outputs.numeric }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "glossa-cli") | .version')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 0.1.0-beta.1 -> 0.1.0, for fields that take numbers only.
          echo "numeric=${version%%-*}" >> "$GITHUB_OUTPUT"

  linux:
    name: build (linux ${{ matrix.arch }})
    needs: version
    runs-on: ubuntu-latest
    # Built on Debian 12 rather than the runner's Ubuntu so the binaries ask
    # for glibc 2.36 at most and start on Debian 12, Ubuntu 22.04 and newer.
    # arm64 is cross-compiled there, against Debian's arm64 libraries.
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            deb: amd64
            appimage: x86_64
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            deb: arm64
            appimage: aarch64
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      NAME: glossa-${{ needs.version.outputs.version }}-${{ matrix.arch }}-linux
    steps:
      # GTK 3 and ALSA are the only libraries linked at build time (see
      # ci.yml); the rest is tooling the bare container lacks. For arm64:
      # the cross compiler, the arm64 builds of those libraries, and qemu to
      # run the result once.
      - name: Build dependencies
        run: |
          if [ "${{ matrix.arch }}" = arm64 ]; then
            dpkg --add-architecture arm64
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential pkg-config curl ca-certificates git file \
              crossbuild-essential-arm64 libgtk-3-dev:arm64 libasound2-dev:arm64 qemu-user
            {
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
              echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
              echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
              echo "PKG_CONFIG_ALLOW_CROSS=1"
              echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
              # dpkg-shlibdeps looks the libraries up for this architecture.
              echo "DEB_HOST_ARCH=arm64"
            } >> "$GITHUB_ENV"
          else
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential pkg-config curl ca-certificates git file \
              libgtk-3-dev libasound2-dev
          fi
      - uses: actions/checkout@v4
      # No build cache in release builds: a fresh, reproducible build from the
      # tag is worth the extra minutes.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: |
          cargo build --release --locked --target "$TARGET" -p glossa-ui-egui -p glossa-cli
          file "target/$TARGET/release/glossa" "target/$TARGET/release/glossa-cli"
      # The engine starts and lists its services (under qemu for arm64).
      - name: Smoke test
        run: |
          run=""
          [ "${{ matrix.arch }}" = arm64 ] && run="qemu-aarch64"
          $run "target/$TARGET/release/glossa-cli" --home "$RUNNER_TEMP/glossa-smoke" services -c translate
      - name: Portable archive
        run: |
          mkdir -p "dist/$NAME/examples/modules" "dist/$NAME/sdk"
          cp "target/$TARGET/release/glossa" "target/$TARGET/release/glossa-cli" "dist/$NAME/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE NOTICE packaging/portable.txt "dist/$NAME/"
          # The menu entry, its icon and a script that installs both for the
          # user (desktops and the portal's shortcut settings name the app
          # from it).
          cp assets/linux/io.github.bropines.Glossa.desktop assets/linux/install.sh "dist/$NAME/"
          cp assets/icons/glossa.png "dist/$NAME/glossa.png"
          # Next to the executable, modules/ is a live module folder that
          # Glossa scans; the examples go under examples/ so they do not
          # load until the user copies one there.
          cp -r modules/js modules/python "dist/$NAME/examples/modules/"
          cp -r sdk/python "dist/$NAME/sdk/"
          find "dist/$NAME" -name __pycache__ -prune -exec rm -rf {} +
          tar -C dist -czf "dist/$NAME-portable.tar.gz" "$NAME"
      # dpkg-shlibdeps (dpkg-dev, from build-essential) reads the library
      # dependencies off the binaries built on this Debian 12.
      - name: Debian package
        run: |
          DEB_ARCH=${{ matrix.deb }} packaging/linux/build-deb.sh "target/$TARGET/release" "$VERSION" dist
          deb="$(ls dist/glossa_*_${{ matrix.deb }}.deb)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
      # Install it the way a user would: apt resolves the dependencies, and
      # the installed glossa-cli runs. (x86_64 only: the runner cannot run
      # an installed arm64 system.)
      - name: Debian package smoke test
        if: matrix.arch == 'x86_64'
        run: |
          apt-get install -y ./dist/glossa_*_amd64.deb
          glossa-cli --home "$RUNNER_TEMP/glossa-deb" services -c translate
          test -f /usr/share/glossa/sdk/python/glossa_module.py
      # Pinned releases, checked against the digests GitHub lists for them.
      # The runtime is embedded as is, so appimagetool fetches nothing.
      # appimagetool runs on this x86-64 machine for both images.
      - name: AppImage tools
        env:
          APPIMAGETOOL_VERSION: '1.9.1'
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_VERSION: '20251108'
          RUNTIME: runtime-${{ matrix.appimage }}
          RUNTIME_SHA256: ${{ matrix.runtime_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/appimage"
          cd "$RUNNER_TEMP/appimage"
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          curl -fsSL -o "$RUNTIME" "https://github.com/AppImage/type2-runtime/releases/download/$RUNTIME_VERSION/$RUNTIME"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" appimagetool "$RUNTIME_SHA256" "$RUNTIME" | sha256sum -c -
          chmod +x appimagetool
      - name: AppImage
        run: |
          APPIMAGETOOL="$RUNNER_TEMP/appimage/appimagetool" \
          APPIMAGE_RUNTIME="$RUNNER_TEMP/appimage/runtime-${{ matrix.appimage }}" \
          APPIMAGE_ARCH=${{ matrix.appimage }} \
            packaging/linux/build-appimage.sh "target/$TARGET/release" "$VERSION" dist
          image="dist/glossa-$VERSION-${{ matrix.appimage }}.AppImage"
          file "$image"
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            # No FUSE in a container: the runtime unpacks itself instead.
            APPIMAGE_EXTRACT_AND_RUN=1 "$image" cli --home "$RUNNER_TEMP/glossa-appimage" services -c translate
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  windows:
    name: build (windows ${{ matrix.arch }})
    needs: version
    # arm64 cross-compiles here with Visual Studio's ARM64 tools (ring's
    # assembly needs the runner's clang, which is on PATH).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            inno: x64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            inno: arm64
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      NAME: glossa-${{ needs.version.outputs.version }}-${{ matrix.arch }}-windows
      # Link the C runtime statically, so the executables start on a system
      # without the Visual C++ redistributable installed. With an explicit
      # --target, RUSTFLAGS leave build scripts and proc macros alone.
      RUSTFLAGS: -C target-feature=+crt-static
      # Code signing, when the repository has a certificate in its secrets:
      # WINDOWS_SIGN_PFX (the .pfx, base64) and WINDOWS_SIGN_PASSWORD.
      # Without them the release is built unsigned.
      WINDOWS_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
      WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p glossa-ui-egui -p glossa-cli
      - name: Sign the executables
        if: env.WINDOWS_SIGN_PFX != ''
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGNTOOL=$($signtool.FullName)" | Out-File -Append $env:GITHUB_ENV
          "SIGN_PFX=$pfx" | Out-File -Append $env:GITHUB_ENV
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_SIGN_PASSWORD /tr http://timestamp.digicert.com /td SHA256 `
            "target\$env:TARGET\release\glossa.exe" "target\$env:TARGET\release\glossa-cli.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # The engine starts and lists its services (x86_64: this runner cannot
      # run arm64 programs).
      - name: Smoke test
        if: matrix.arch == 'x86_64'
        run: '"target/$TARGET/release/glossa-cli.exe" --home "$RUNNER_TEMP/glossa-smoke" services -c translate'
      # The installer and the portable zip hold the same files; only the zip
      # has portable.txt (glossa.iss leaves it out), which keeps the data in
      # data/ beside glossa.exe.
      - name: Stage
        run: |
          mkdir -p "dist/$NAME/examples/modules" "dist/$NAME/sdk"
          cp "target/$TARGET/release/glossa.exe" "target/$TARGET/release/glossa-cli.exe" "dist/$NAME/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE NOTICE "dist/$NAME/"
          cp -r modules/js modules/python "dist/$NAME/examples/modules/"
          cp -r sdk/python "dist/$NAME/sdk/"
          find "dist/$NAME" -name __pycache__ -prune -exec rm -rf {} +
      - name: Portable zip
        run: |
          cp packaging/portable.txt "dist/$NAME/"
          cd dist && 7z a -tzip "$NAME-portable.zip" "$NAME" > /dev/null
      # Inno Setup 6 comes with the runner image.
      - name: Installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$env:VERSION" "/DArch=${{ matrix.inno }}" "/DStageDir=$PWD\dist\$env:NAME" "/O$PWD\dist" packaging\windows\glossa.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign the installer
        if: env.WINDOWS_SIGN_PFX != ''
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /fd SHA256 /f $env:SIGN_PFX /p $env:WINDOWS_SIGN_PASSWORD /tr http://timestamp.digicert.com /td SHA256 `
            "dist\$env:NAME-setup.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item $env:SIGN_PFX
      # Install silently for this user, run the installed CLI, uninstall, and
      # check that nothing is left in the folder. (x86_64 only: the arm64
      # installer refuses an x64 machine.)
      - name: Installer smoke test
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\glossa-installed"
          $p = Start-Process "dist\$env:NAME-setup.exe" -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`""
          if ($p.ExitCode) { throw "setup exited with $($p.ExitCode)" }
          foreach ($f in 'glossa.exe', 'glossa-cli.exe', 'sdk\python\glossa_module.py', 'examples\modules') {
            if (-not (Test-Path "$dir\$f")) { throw "$f was not installed" }
          }
          if (Test-Path "$dir\portable.txt") { throw "the installer installed the portable marker" }
          if (Test-Path "$dir\data") { throw "the installer made a portable data folder" }
          & "$dir\glossa-cli.exe" --home "$env:RUNNER_TEMP\glossa-home" services -c translate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $p = Start-Process "$dir\unins000.exe" -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode) { throw "uninstall exited with $($p.ExitCode)" }
          # unins000.exe hands over to a temporary copy of itself and returns
          # at once; wait for the copy to finish.
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\glossa.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\glossa.exe") { throw "glossa.exe is still there after uninstalling" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  macos:
    name: build (macOS arm64 + x86_64)
    needs: version
    # Apple silicon; the Intel build cross-compiles with the same Xcode SDK.
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NUMERIC_VERSION: ${{ needs.version.outputs.numeric }}
      # Apple Vision's text recogniser appeared in 10.15 (Apple silicon
      # starts at 11 anyway). Matches LSMinimumSystemVersion in Info.plist.
      MACOSX_DEPLOYMENT_TARGET: '10.15'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" -p glossa-ui-egui -p glossa-cli
          done
          lipo -info target/aarch64-apple-darwin/release/glossa target/x86_64-apple-darwin/release/glossa
      - name: Icon
        run: |
          # The source is 256 px: sizes above that would only be blurred
          # copies, and iconutil accepts a set without them.
          set -euo pipefail
          mkdir -p build/glossa.iconset
          for s in 16 32 128 256; do
            sips -z "$s" "$s" assets/icons/glossa.png --out "build/glossa.iconset/icon_${s}x${s}.png" > /dev/null
          done
          for s in 16 32 128; do
            d=$((s * 2))
            sips -z "$d" "$d" assets/icons/glossa.png --out "build/glossa.iconset/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns build/glossa.iconset -o build/glossa.icns
      - name: Package
        run: |
          set -euo pipefail
          package() { # arch, folder holding glossa and glossa-cli
            local name="glossa-$VERSION-$1-macos"
            local root="dist/$name"
            local app="$root/Glossa.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/sdk" "$root/examples/modules"
            sed "s/@VERSION@/$NUMERIC_VERSION/g" assets/macos/Info.plist > "$app/Contents/Info.plist"
            plutil -lint "$app/Contents/Info.plist"
            cp "$2/glossa" "$app/Contents/MacOS/"
            cp build/glossa.icns "$app/Contents/Resources/"
            # Python modules import glossa_module.py; Glossa looks for it in
            # the bundle's Resources.
            cp -r sdk/python "$app/Contents/Resources/sdk/"
            cp "$2/glossa-cli" "$root/"
            cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE NOTICE "$root/"
            cp -r modules/js modules/python "$root/examples/modules/"
            find "$root" -name __pycache__ -prune -exec rm -rf {} +
            # Not notarised: an ad-hoc signature keeps Apple silicon willing
            # to run it; the first launch of a download needs System
            # Settings > Privacy & Security > Open Anyway on macOS 15 and
            # later (right-click > Open before), or
            # xattr -dr com.apple.quarantine Glossa.app.
            codesign --force --deep --sign - "$app"
            codesign --force --sign - "$root/glossa-cli"
            codesign --verify --deep --strict "$app"
            # Smoke test: the engine starts and lists the OCR engines, Apple
            # Vision among them. The Intel build runs under Rosetta, when the
            # runner has it.
            local run=""
            if [ "$1" = x86_64 ]; then
              if arch -x86_64 /usr/bin/true 2>/dev/null; then run="arch -x86_64"; else run="skip"; fi
            fi
            if [ "$run" = skip ]; then
              echo "::warning::no Rosetta on this runner; the Intel build was not run"
            else
              $run "$root/glossa-cli" --home "$RUNNER_TEMP/glossa-$1" services -c ocr | tee "$RUNNER_TEMP/ocr-$1.txt"
              grep -q macos-vision "$RUNNER_TEMP/ocr-$1.txt"
            fi
            ditto -c -k --sequesterRsrc --keepParent "$root" "dist/$name.zip"
            # The disk image: Glossa.app and a link to /Applications to drag
            # it onto. ditto keeps the signature intact.
            local stage="$RUNNER_TEMP/dmg-$1"
            rm -rf "$stage"
            mkdir -p "$stage"
            ditto "$app" "$stage/Glossa.app"
            ln -s /Applications "$stage/Applications"
            # hdiutil fails now and then on CI runners ("Resource busy").
            local try
            for try in 1 2 3; do
              if hdiutil create -volname "Glossa $VERSION" -srcfolder "$stage" -fs HFS+ \
                  -format UDZO -ov "dist/$name.dmg"; then
                break
              fi
              [ "$try" = 3 ] && exit 1
              sleep 10
            done
            hdiutil verify "dist/$name.dmg"
          }
          package arm64 target/aarch64-apple-darwin/release
          package x86_64 target/x86_64-apple-darwin/release
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  release:
    name: draft release
    # Only for a tag; a run by hand stops at the artifacts.
    if: github.ref_type == 'tag'
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # winget and Scoop manifests pointing at this release's Windows files.
      # They work once the release is published in a public repository.
      - name: Package manager manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/fill-manifests.sh "$VERSION" dist
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A short page written for the release, packaging/release-notes/
          # <version>.md, when there is one (the CHANGELOG section of a big
          # release is too long to read there). Else this version's section
          # of CHANGELOG.md with the downloads under it; GitHub's generated
          # notes when there is neither.
          if [ -f "packaging/release-notes/$VERSION.md" ]; then
            notes=(--notes-file "packaging/release-notes/$VERSION.md")
          elif awk -v v="$VERSION" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md && [ -s notes.md ]; then
            # What to download, for every platform, under the changes.
            cat >> notes.md <<'EOF'

          ### Downloads

          `x86_64` is an ordinary Intel or AMD PC (and an Intel Mac); `arm64` is ARM: Apple silicon Macs, Snapdragon Windows laptops, ARM Linux boards.

          - **Windows 10, 11**
            - `glossa-*-x86_64-windows-setup.exe` / `glossa-*-arm64-windows-setup.exe`: installs for your account without admin rights (Start menu, optional autostart, uninstaller).
            - `glossa-*-x86_64-windows-portable.zip` / `glossa-*-arm64-windows-portable.zip`: unzip anywhere and run `glossa.exe`; settings stay in the `data` folder next to it.
            - Not signed yet, so SmartScreen may warn: *More info → Run anyway*.
          - **macOS 10.15+** (11+ on Apple silicon)
            - `glossa-*-arm64-macos.dmg` (Apple silicon) / `glossa-*-x86_64-macos.dmg` (Intel): drag `Glossa.app` to Applications. The `.zip` holds the same app plus `glossa-cli`.
            - A menu-bar app, not notarised: open it once, then *System Settings → Privacy & Security → Open Anyway* (or `xattr -dr com.apple.quarantine /Applications/Glossa.app`). The README's macOS section lists the permissions it asks for.
          - **Linux** (x86_64, arm64): **not tested on real hardware yet**, expect rough edges and please report them.
            - `glossa_*_amd64.deb` / `glossa_*_arm64.deb` for Debian 12, Ubuntu 22.04 and newer: `sudo apt install ./glossa_*.deb`.
            - `glossa-*-x86_64.AppImage` / `glossa-*-aarch64.AppImage` for other distributions.
            - `glossa-*-linux-portable.tar.gz`: unpack and run `./glossa`; settings stay in `data/` next to it.

          See [docs/install.md](https://github.com/bropines/glossa/blob/main/docs/install.md) for details. `SHA256SUMS` lists every file's checksum.
          EOF
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          # v1.2.3-beta.1 and the like are pre-releases.
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; *) pre=() ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --title "Glossa $VERSION" "${notes[@]}" "${pre[@]}"
